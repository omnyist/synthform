services:
  overlays:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    # The preview server proxies wss://<origin>/obs to OBS's websocket on the
    # HOST (the telestrator on the iPad); inside the container 127.0.0.1 is
    # the container, so give it the host's name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
